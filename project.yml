name: WakeHere
options:
  bundleIdPrefix: com.wakehere
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  WakeHereDomain:
    path: Packages/WakeHereDomain
  WakeHereData:
    path: Packages/WakeHereData

targets:
  WakeHere:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Info.plist"
          - "WakeHere.entitlements"
    dependencies:
      - package: WakeHereDomain
      - package: WakeHereData
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wakehere.app
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/WakeHere.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        CURRENT_PROJECT_VERSION: "1"
        # Entrega via Sideloadly: o CI gera o .ipa SEM assinatura;
        # o Sideloadly re-assina com a Apple ID do usuário.
        # (para archive local no Mac, passe CODE_SIGNING_ALLOWED=NO)

schemes:
  WakeHere:
    build:
      targets:
        WakeHere: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
