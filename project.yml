name: AcordeAqui
options:
  bundleIdPrefix: com.acordeaqui
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  AcordeAquiDomain:
    path: Packages/AcordeAquiDomain
  AcordeAquiData:
    path: Packages/AcordeAquiData

targets:
  AcordeAqui:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Info.plist"
          - "AcordeAqui.entitlements"
    dependencies:
      - package: AcordeAquiDomain
      - package: AcordeAquiData
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.acordeaqui.app
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/AcordeAqui.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        CURRENT_PROJECT_VERSION: "1"
        # Entrega via Sideloadly: o CI gera o .ipa SEM assinatura;
        # o Sideloadly re-assina com a Apple ID do usuário.
        # (para archive local no Mac, passe CODE_SIGNING_ALLOWED=NO)

schemes:
  AcordeAqui:
    build:
      targets:
        AcordeAqui: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
