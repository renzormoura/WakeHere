name: iOS CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Domain tests (SwiftPM)
        run: |
          swift test --package-path Packages/WakeHereDomain
          swift test --package-path Packages/WakeHereData

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          echo "::notice::$(xcodebuild -version | xargs) / xcodegen $(xcodegen --version)"

      - name: Build app (iOS Simulator)
        run: |
          set +e
          xcodebuild build \
            -project WakeHere.xcodeproj \
            -scheme WakeHere \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          # Expõe os erros como annotations (visíveis sem abrir os logs).
          grep -E "error:" build.log | sort -u | head -20 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          exit $status
