name: Build IPA (Sideloadly)

# Gera o AcordeAqui.ipa SEM assinatura.
# Baixe o artifact e instale no iPhone via Sideloadly + iTunes no Windows.
on:
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive (Release, sem assinatura)
        run: |
          xcodebuild archive \
            -project AcordeAqui.xcodeproj \
            -scheme AcordeAqui \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/AcordeAqui.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package .ipa
        run: |
          mkdir -p build/Payload
          cp -R build/AcordeAqui.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -qry AcordeAqui.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AcordeAqui.ipa
          path: build/AcordeAqui.ipa
          if-no-files-found: error
