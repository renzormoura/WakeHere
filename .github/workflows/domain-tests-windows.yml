name: Domain Tests (Windows)

on:
  push:
  pull_request:

jobs:
  swift-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Swift toolchain
        shell: pwsh
        run: |
          winget install --id Swift.Toolchain --accept-source-agreements --accept-package-agreements --disable-interactivity --silent

      - name: Add Swift to PATH
        shell: pwsh
        run: |
          $userPath = (Get-ItemProperty "HKCU:\Environment").Path
          $toolchain = ($userPath -split ";") | Where-Object { $_ -match "Toolchains" } | Select-Object -First 1
          if (-not $toolchain) { throw "Swift toolchain not found in user PATH" }
          Add-Content -Path $env:GITHUB_PATH -Value $toolchain
          Write-Host "Swift bin: $toolchain"

      - name: Test WakeHereDomain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          swift test --package-path Packages/WakeHereDomain 2>&1 | Tee-Object -FilePath domain.log
          $code = $LASTEXITCODE
          Select-String -Path domain.log -Pattern "error:|failed|fatal" | Select-Object -First 20 | ForEach-Object { Write-Host "::error::$($_.Line)" }
          exit $code

      - name: Test WakeHereData
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          swift test --package-path Packages/WakeHereData 2>&1 | Tee-Object -FilePath data.log
          $code = $LASTEXITCODE
          Select-String -Path data.log -Pattern "error:|failed|fatal" | Select-Object -First 20 | ForEach-Object { Write-Host "::error::$($_.Line)" }
          exit $code
